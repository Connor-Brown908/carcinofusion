# Data acquisition and provenance configuration.
#
# The CPDB tab-separated files are NOT redistributed with this repository.
# Download them yourself (see docs/dataset_protocol.md) and place the
# untouched originals in data/raw/cpdb/.
#
# Nothing in this pipeline ever writes to data/raw/. Raw files are read-only
# inputs whose checksums are recorded in manifests/.

# v2: label policy v1.1.0 raised min_negative_records from 1 to 2, so a
# compound needs two corroborating negative bioassays before it is labelled
# negative. A frozen dataset is immutable, so the change produces a new
# version rather than editing v1.
# v3: label policy v1.2.0 added the CPDB single-character author-opinion
# codes ('+', '-') to the record-level vocabulary and made an unrecognised
# vocabulary a hard failure instead of a silent null.
# v4: label policy v1.3.0 replaced the inferred opinion vocabulary with the
# codes defined in CPDB's own author's-opinion appendix, adding 'c' (NCI/NTP
# clear evidence, 19.6% of the NCI/NTP file), moving 'p' (some evidence) out
# of the primary positives, dropping the invented 'n', and declaring '0' as
# the blank-opinion sentinel rather than a code.
dataset_version: v4

sources:
  cpdb:
    source_database: CPDB
    description: >
      Carcinogenic Potency Database. Long-term animal carcinogenicity
      experiments compiled from the NCI/NTP bioassay program and the
      general published literature.
    # CPDB is no longer updated. NLM's note on the data.gov catalogue entry
    # reads "This dataset is no-longer updated with new content", so these are
    # archival files and the version you download should not drift.
    #
    # Mirrors are tried in order. NLM is the authoritative source; ToxPlanet
    # hosts the same tab-separated distribution and appends `.txt` to every
    # filename, which the downloader normalises.
    base_url: https://ftp.nlm.nih.gov/projects/SISFTP/CPDB/Data%20Files/
    mirrors:
      - name: nlm
        base_url: https://ftp.nlm.nih.gov/projects/SISFTP/CPDB/Data%20Files/
        suffix: ""
      - name: toxplanet
        base_url: https://files.toxplanet.com/cpdb/tab/
        suffix: ".txt"
    documentation:
      - https://ftp.nlm.nih.gov/projects/SISFTP/CPDB/Documentation/Tab_Separated_CPDB.pdf
      - https://files.toxplanet.com/cpdb/pdfs/Documentation_for_tab.pdf
      - https://files.toxplanet.com/cpdb/methods.html
    catalogue: https://catalog.data.gov/dataset/carcinogenic-potency-database-cpdb
    retrieval_date: null        # set by download_cpdb.py at acquisition time
    source_version: null        # set manually after reading CPDB documentation
    license: >
      CPDB is distributed by the US National Library of Medicine. Confirm
      current terms of use before redistribution. This repository stores
      checksums and derived data only.
    raw_dir: data/raw/cpdb
    files:
      # Primary experimental records
      ncintp:
        filename: cpdb.ncintp.tab
        role: experiments
        description: NCI/NTP long-term bioassay experimental records.
        required: true
      lit:
        filename: cpdb.lit.tab
        role: experiments
        description: Carcinogenicity experiments from the general literature.
        required: true
      # Chemical identity
      chemname:
        filename: cpdb.chemname.tab
        role: chemical_identity
        description: Chemical names, CPDB chemcodes and CAS Registry Numbers.
        required: true
      # Dose / tumour-incidence detail
      ncntdose:
        filename: cpdb.ncntdose.tab
        role: dose_response
        description: Dose and tumour-incidence detail for NCI/NTP records.
        required: false
      litdose:
        filename: cpdb.litdose.tab
        role: dose_response
        description: Dose and tumour-incidence detail for literature records.
        required: false
      # Literature citations. Not used by the current pipeline, but it is what
      # turns a refnum into a traceable study, so it is worth having locally.
      cit:
        filename: cpdb.cit.tab
        role: citations
        description: Literature citation detail, keyed by reference number.
        required: false
      # Appendix lookup tables. CPDB encodes species, strain, route, site and
      # histopathology as codes; these decode them. configs/cpdb_columns.yaml
      # carries a small hand-written vocabulary for species and sex, which
      # these tables supersede — prefer them once downloaded.
      species_lookup:
        filename: cpdb.species.tab
        role: vocabulary
        description: Species code lookup.
        required: false
      strain_lookup:
        filename: cpdb.strain.tab
        role: vocabulary
        description: Strain code lookup.
        required: false
      route_lookup:
        filename: cpdb.route.tab
        role: vocabulary
        description: Exposure route code lookup.
        required: false
      tissue_lookup:
        filename: cpdb.tissue.tab
        role: vocabulary
        description: Target site (tissue) code lookup.
        required: false
      tumor_lookup:
        filename: cpdb.tumor.tab
        role: vocabulary
        description: Histopathology code lookup.
        required: false
      journal_lookup:
        filename: cpdb.journal.tab
        role: vocabulary
        description: Journal code lookup.
        required: false

# Where derived artefacts land. Each stage writes to its own directory so a
# stage can be re-run without disturbing the others.
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  external: data/external
  manifests: manifests

# Structure resolution.
#
# No network lookup runs automatically. Structures are read from a local
# resolution table you supply (see docs/dataset_protocol.md). This keeps the
# pipeline reproducible and auditable: the structure a compound had on the day
# the dataset was frozen is recorded, not re-fetched.
structure_resolution:
  # Tab- or comma-separated file with at least: cas_number, smiles
  # Optional: chemcode, source, retrieved_date, inchi
  resolution_table: data/external/structure_resolution.tsv
  # A CAS number alone is never treated as proof of identity. A resolved
  # structure must carry a named source and a retrieval date.
  require_source_attribution: true
