name: carcinofusion
channels:
  - conda-forge
dependencies:
  - python=3.11
  - rdkit>=2024.03
  - pandas>=2.0
  - pyarrow>=14
  - numpy>=1.24
  - pyyaml>=6.0
  - pytest>=7.4
  # Optional, for loading the curated tables into PostgreSQL.
  # The export path uses psql \copy and needs no Python driver.
  - postgresql
  # Phase 2 modelling, not used by the Phase 1 pipeline.
  - scikit-learn>=1.3
